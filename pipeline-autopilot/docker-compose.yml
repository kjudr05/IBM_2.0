services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./sample-data:/app/sample-data:ro
      - ./data:/app/data
    environment:
      - APP_ENV=development
      - SAMPLE_DATA_DIR=/app/sample-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy